<svg width="240" height="60" viewBox="0 0 240 60" xmlns="http://www.w3.org/2000/svg">
    <!-- Main text SPECTRA -->
    <text x="10" y="26" 
          font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" 
          font-size="22" 
          font-weight="700" 
          fill="#000000" 
          letter-spacing="1.5">SPECTRA</text>
    
    <!-- Waterline -->
    <line x1="10" y1="34" x2="200" y2="34" 
          stroke="#000000" 
          stroke-width="2" 
          stroke-linecap="round"/>
    
    <!-- Hull arrowhead -->
    <path d="M 200 34 L 215 28 L 223 34 L 215 40 Z" 
          fill="#000000" 
          stroke="#000000" 
          stroke-width="1.2" 
          stroke-linejoin="miter"/>
    
    <!-- Centerline (white for contrast) -->
    <line x1="215" y1="34" x2="223" y2="34" 
          stroke="#ffffff" 
          stroke-width="1"/>
    
    <!-- NAVAL text -->
    <text x="10" y="50" 
          font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" 
          font-size="10" 
          font-weight="400" 
          fill="#000000" 
          letter-spacing="2.5">NAVAL</text>
</svg>